; PlatformIO Project Configuration File
;
; T-CAN485 Tank-Level Bridge: reads RS485 Modbus water-level sensor,
; republishes as NMEA 2000 PGN 127505 to a Victron Cerbo GX over VE.Can.
; The vendored LilyGo T-CAN485 repo lives in ./T-CAN485 (git submodule); we
; pull pin_config.h and FastLED from its lib/ via lib_extra_dirs below.

[env:esp32dev]
platform = espressif32@6.11.0
framework = arduino
board = esp32dev
; min_spiffs.csv splits flash into two 1.9 MB OTA app slots so the web UI's
; /api/ota endpoint can stage a new image while the running one keeps serving.
; (huge_app.csv had a single 3 MB slot — no OTA possible.) NVS stays at the
; same offset, so saved WiFi creds and config survive the switch — but the
; FIRST flash after this change must be `pio run -t erase && pio run -t upload`
; over wire to clear stale otadata from the previous layout.
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
; pin_config.h and the FastLED-3.7.0 fork live in the vendored T-CAN485 repo.
lib_extra_dirs = T-CAN485/lib
; Pre-build hook: minifies src/index_html.src.html into a generated
; .pio/build/<env>/generated/index_html.h that WebUi.cpp #includes.
extra_scripts = pre:scripts/build_index_html.py
build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; NMEA2000_esp32_twai defaults to TX=GPIO16, RX=GPIO4.
    ; GPIO16 is ME2107_EN (boost enable!) on this board — must override.
    -DESP32_CAN_TX_PIN=GPIO_NUM_27
    -DESP32_CAN_RX_PIN=GPIO_NUM_26
lib_deps =
    ttlappalainen/NMEA2000-library@^4.22.0
    https://github.com/sergei/NMEA2000_esp32_twai.git
    esp32async/ESPAsyncWebServer@^3.4.0
    esp32async/AsyncTCP@^3.2.0
    bblanchon/ArduinoJson@^7.0.0
